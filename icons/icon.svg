<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#08090f"/>
      <stop offset="50%" stop-color="#121626"/>
      <stop offset="100%" stop-color="#060810"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="50%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="neonGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background rounded box -->
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)"/>
  <rect x="16" y="16" width="480" height="480" rx="112" fill="none" stroke="url(#neonGrad)" stroke-width="8" opacity="0.6"/>

  <!-- Rotating ring effect -->
  <circle cx="256" cy="256" r="180" fill="none" stroke="url(#neonGrad)" stroke-width="6" stroke-dasharray="30 15" opacity="0.4"/>

  <!-- Beta Greek Symbol -->
  <text x="256" y="340" font-family="'Orbitron', 'Segoe UI', system-ui, sans-serif" font-size="280" font-weight="900" fill="url(#neonGrad)" text-anchor="middle" filter="url(#neonGlow)">β</text>

  <!-- Mini Cinema Play Triangle -->
  <polygon points="340,256 300,230 300,282" fill="#06b6d4" opacity="0.9"/>
</svg>
