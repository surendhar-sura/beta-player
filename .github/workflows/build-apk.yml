name: Build Android APK (Offline Mobile App)

on:
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab
  push:
    branches:
      - main
    paths-ignore:
      - 'README.md'
      - '.gitignore'

jobs:
  build-apk:
    name: Build Offline Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Prepare Clean Web Directory
        run: |
          mkdir -p www
          cp index.html styles.css app.js manifest.json sw.js www/
          cp -r icons www/

      - name: Install Capacitor CLI & Android
        run: |
          npm install --save-dev @capacitor/core@6.0.0 @capacitor/cli@6.0.0 @capacitor/android@6.0.0

      - name: Initialize Capacitor Android Project
        run: |
          npx cap init "Beta Player" "com.surendhar.betaplayer" --web-dir "www"
          npx cap add android
          npx cap copy android

      - name: Build Android Debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Copy & Rename APK
        run: |
          mkdir -p build-output
          cp android/app/build/outputs/apk/debug/app-debug.apk build-output/BetaPlayer-Offline.apk

      - name: Upload APK as Downloadable Artifact
        uses: actions/upload-artifact@v4
        with:
          name: BetaPlayer-Android-APK
          path: build-output/BetaPlayer-Offline.apk
          retention-days: 90
